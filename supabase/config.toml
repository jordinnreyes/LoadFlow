# LOCAL DEVELOPMENT ONLY. No hosted project, credentials or migrations are deployed.
project_id = "cargawise-f0"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
# Provider local default, not an approved CargaWise file quota. Upload API comes in F3.
file_size_limit = "50MiB"
[storage.s3_protocol]
enabled = false
[storage.analytics]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://127.0.0.1:3001/api/v1/auth/google/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "Código de acceso CargaWise (pruebas locales)"
content_path = "./supabase/templates/otp.html"
[auth.email.template.confirmation]
subject = "Confirma tu cuenta CargaWise (pruebas locales)"
content_path = "./supabase/templates/otp.html"
[auth.rate_limit]
# Fixture harness only: Mailpit captures all messages; never a product email quota.
email_sent = 1000
[edge_runtime]
enabled = false
[analytics]
enabled = false
[experimental.pgdelta]
enabled = false
